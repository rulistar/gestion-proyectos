name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permisos mínimos: el workflow solo necesita leer el código
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias (exactamente las del lockfile)
        run: pnpm install --frozen-lockfile

      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Tipos (TypeScript)
        run: pnpm typecheck

      - name: Pruebas (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Falla si hay vulnerabilidades altas o críticas (objetivo 2 del acta)
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo: gitleaks revisa todos los commits del PR

      - uses: gitleaks/gitleaks-action@v3
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

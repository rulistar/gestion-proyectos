name: CI

on:
  pull_request:
  push:
    branches: [main]

# Permisos mínimos: el workflow solo necesita leer el código
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint, tipos y pruebas
    runs-on: ubuntu-latest
    # PostgreSQL temporal para las pruebas de integración (se destruye al terminar el job).
    # Credenciales de un solo uso, sin valor fuera de este contenedor efímero.
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      # Las pruebas usan gestion_test (sufijo _test), que crean y migran solas
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gestion
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias (exactamente las del lockfile)
        run: pnpm install --frozen-lockfile

      - name: Formato (Prettier)
        run: pnpm format:check

      - name: Lint (ESLint)
        run: pnpm lint

      - name: Tipos (TypeScript)
        run: pnpm typecheck

      - name: Pruebas (Vitest)
        run: pnpm test

      - name: Build
        run: pnpm build

  e2e:
    name: Pruebas en el navegador (Playwright)
    runs-on: ubuntu-latest
    # Misma BD efímera que el job de pruebas; el servidor de pruebas crea y migra gestion_e2e
    services:
      postgres:
        image: postgres:17-alpine
        env:
          POSTGRES_USER: ci
          POSTGRES_PASSWORD: ci
          POSTGRES_DB: gestion
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U ci -d gestion"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgresql://ci:ci@localhost:5432/gestion
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: pnpm

      - name: Instalar dependencias (exactamente las del lockfile)
        run: pnpm install --frozen-lockfile

      # En el CI, el Chromium de Playwright (en la PC del PO se usa el Edge instalado)
      - name: Instalar el navegador
        run: pnpm --filter @gestion/e2e exec playwright install --with-deps chromium

      - name: Recorrido en el navegador
        run: pnpm test:e2e

  audit:
    name: Auditoría de dependencias
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: pnpm/action-setup@v6

      - uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc

      # Falla si hay vulnerabilidades altas o críticas (objetivo 2 del acta)
      - name: pnpm audit
        run: pnpm audit --audit-level=high

  secrets:
    name: Escaneo de secretos (gitleaks)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # historial completo: gitleaks revisa todos los commits del PR

      # Binario oficial con versión fija (no la action): revisa todo el historial
      # igual en push que en PR, y es el mismo comando que se puede correr en local
      - name: gitleaks
        run: docker run --rm -v "$PWD:/repo" zricethezav/gitleaks:v8.30.1 git /repo --redact --verbose
